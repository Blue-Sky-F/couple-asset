server:
  port: 8080

spring:
  application:
    name: couple-asset-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/couple_asset?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    issuer: couple-asset
    secret: ${JWT_SECRET:dev-secret-dev-secret-dev-secret-dev-32bytes}
    accessTokenMinutes: 120
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    householdName: ${APP_SEED_HOUSEHOLD_NAME:}
    user1Name: ${APP_SEED_USER1_NAME:}
    user1Phone: ${APP_SEED_USER1_PHONE:}
    user2Name: ${APP_SEED_USER2_NAME:}
    user2Phone: ${APP_SEED_USER2_PHONE:}
    password: ${APP_SEED_PASSWORD:}
